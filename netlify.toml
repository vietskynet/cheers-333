[build]
  publish = "public"
  # Bước build duy nhất: tải ảnh của /agcCombat/ (vẽ bằng Higgsfield) về public/agcCombat/ nếu repo chưa có file.
  command = "node scripts/fetch-agc-assets.mjs"
  # Trang tĩnh nằm trong public/, API nằm trong netlify/edge-functions/ và netlify/functions/
  # Có package.json (gói @netlify/database) nên Netlify tự cài gói và tự tạo database khi deploy.

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
